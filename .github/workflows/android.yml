name: Android APK
on:
  push:
    branches: ['feature/android-apk-v1']
  workflow_dispatch:
    inputs:
      assets_url:
        description: URL HTTPS de Hexagrogne-assets.zip en Release
        required: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Récupérer le ZIP vérifié de Fab
        env:
          ASSETS_URL: ${{ inputs.assets_url || vars.HEXAGROGNE_ASSETS_URL || 'https://raw.githubusercontent.com/greenpower2669/Hexagrogne/ff05aa4e2f30b1bb5cb2eee899ec9e83168fb7c1/Hexagrogne-assets.zip' }}
        run: |
          if [ -z "$ASSETS_URL" ]; then
            echo 'Définir HEXAGROGNE_ASSETS_URL après dépôt du ZIP en Release.' >&2
            exit 1
          fi
          curl --fail --location --proto '=https' --proto-redir '=https' "$ASSETS_URL" -o /tmp/Hexagrogne-assets.zip
          python3 scripts/restore-assets.py /tmp/Hexagrogne-assets.zip
      - name: Intégrer les trois exports Fab V3 dans le bundle hors-ligne
        run: |
          mkdir -p /tmp/fab-v3-exports
          for file in FabHexaGrogne-IA-ligue-cycle-1341.json FabHexaBrain-V2-corpus-2026-10-08.json FabHexaGrogne-victoires-humaines-2026-10-08.json; do
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' "https://raw.githubusercontent.com/greenpower2669/Hexagrogne/4d900a8fe71d87749fd5bae4a9f807724606cdc9/$file" -o "/tmp/fab-v3-exports/$file"
          done
          python3 scripts/stage-fab-exports.py /tmp/fab-v3-exports
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run android:sync
      - name: Contrôler la présence des exports dans l'application Android
        run: |
          python3 scripts/stage-fab-exports.py /tmp/fab-v3-exports --check-packaged
      - run: gradle -p android assembleDebug --no-daemon
      - name: Nommer APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hexagrogne-0.1.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hexagrogne-0.1.1-debug
          path: Hexagrogne-0.1.1-debug.apk
